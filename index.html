<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>長野 林道カルテマップ</title>
<meta name="theme-color" content="#12161b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#12161b; --panel:#1b2129; --panel-2:#232b35; --line:#333e4a;
    --ink:#e8edf2; --ink-dim:#95a1af; --accent:#ff8a00;
    --paved:#6b7a8f; --unpaved:#ff8a00; --unpaved-inf:#ffb347; --unknown:#9aa0a6; --me:#1e90ff;
    --karte:#22d3a5;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  #map{position:absolute;inset:0}

  .bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;
       padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;pointer-events:none}
  .bar > *{pointer-events:auto}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-dim);
         background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;
         display:flex;align-items:center;gap:7px;white-space:nowrap}
  .brand b{color:var(--karte);font-weight:600}
  .grow{flex:1}
  button{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--panel);
         border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;
         display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  button:active{background:var(--panel-2)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#1a1204;font-weight:600}
  button.on{background:var(--me);border-color:var(--me);color:#04121f;font-weight:600}
  button.on.show{background:var(--panel);border-color:var(--me);color:var(--me)}
  button.kon{background:var(--karte);border-color:var(--karte);color:#04140f;font-weight:600}

  .fetch{position:absolute;left:50%;transform:translateX(-50%);z-index:5;
         bottom:calc(env(safe-area-inset-bottom) + 152px)}

  .dock{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;
        background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .row{display:flex;align-items:center;gap:8px}
  .row + .row{margin-top:9px}
  .layers{display:flex;gap:6px}
  .chip{font-size:12.5px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);
        background:var(--panel-2);color:var(--ink-dim);cursor:pointer}
  .chip.sel{background:var(--ink);color:#0f1419;border-color:var(--ink);font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:9px 13px;font-size:11.5px;color:var(--ink-dim)}
  .key{display:flex;align-items:center;gap:6px}
  .swatch{width:20px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--karte);border:2px solid #04140f}
  .stat{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim)}
  .stat b{color:var(--ink);font-weight:600}

  .toast{position:absolute;left:50%;transform:translateX(-50%);z-index:20;
         top:calc(env(safe-area-inset-top) + 62px);
         background:#0c0f13ee;border:1px solid var(--line);border-radius:9px;padding:10px 14px;
         font-size:13px;max-width:88vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .spin{width:14px;height:14px;border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;
        display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* カルテ ボトムシート */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;max-height:82vh;
         background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
         transform:translateY(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
         padding:0 0 calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column}
  .sheet.open{transform:translateY(0)}
  .grip{width:38px;height:4px;background:var(--line);border-radius:3px;margin:9px auto 4px}
  .sheet-head{display:flex;align-items:flex-start;gap:10px;padding:4px 16px 10px;border-bottom:1px solid var(--line)}
  .sheet-title{flex:1}
  .sheet-title h2{margin:0;font-size:18px}
  .sheet-title .sub{color:var(--ink-dim);font-size:12.5px;margin-top:3px}
  .xbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;
        display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink-dim);cursor:pointer;flex:none}
  .sheet-body{overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .badge{font-size:12px;padding:4px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink)}
  .badge.warn{border-color:#7a5a12;background:#2a2210;color:#ffd27a}
  .badge.diff{border-color:#3a4a5a}

  .grid{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;align-items:baseline}
  .grid .k{color:var(--ink-dim);white-space:nowrap}
  .grid .v{color:var(--ink)}
  .grid .v.mono{font-family:var(--mono)}
  .stars{color:var(--accent);letter-spacing:1px}
  .stars .off{color:#3a4450}
  .sect{margin:15px 0 7px;font-size:11px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}
  .notes{font-size:13px;line-height:1.6;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
         border-radius:9px;padding:10px 12px;margin-top:4px}
  .src{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:7px}
  .src .st{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .src .type{font-size:11px;color:var(--karte);font-family:var(--mono)}
  .src a{color:#5db4ff;font-size:13px;text-decoration:none;word-break:break-all}
  .src .memo{color:var(--ink-dim);font-size:12px;margin-top:4px;line-height:1.5}
  .sheet-actions{display:flex;gap:8px;padding:10px 16px 0}
  .sheet-actions button{flex:1;justify-content:center}
  .verify{font-size:11.5px;color:#ffd27a;background:#2a2210;border:1px solid #7a5a12;border-radius:8px;
          padding:8px 11px;margin-top:12px;line-height:1.5}

  .maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;font-family:var(--sans);font-size:13px;padding:11px 13px;min-width:150px}
  .maplibregl-popup-content b{color:var(--accent)}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  .prow{display:flex;justify-content:space-between;gap:14px;margin-top:3px}
  .pk{color:var(--ink-dim)} .pv{color:var(--ink)}
  .pbtns{display:flex;gap:7px;margin-top:10px}
  .pbtn{flex:1;font-size:12.5px;padding:8px 6px;border-radius:7px;border:1px solid var(--line);
        background:var(--panel-2);color:var(--ink);cursor:pointer}
  .pbtn.nav{background:var(--me);border-color:var(--me);color:#04121f;font-weight:600}
  .searchwrap{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:10px;right:10px;z-index:6;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 24px #0008}
  .searchwrap[hidden]{display:none}
  .searchwrap input#q{width:100%;font-size:15px;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
  .searchwrap input#q::placeholder{color:var(--ink-dim)}
  .sresults{margin-top:6px;max-height:38vh;overflow-y:auto;display:none}
  .sitem{padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sitem:active{background:var(--panel-2)}
  .sitem .stype{font-size:10.5px;color:var(--ink-dim);font-family:var(--mono);flex:none}
  .sitem.muted{color:var(--ink-dim);cursor:default}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .filters select{flex:1;min-width:86px;font-size:12.5px;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:7px;padding:7px 8px;outline:none}
  .fclear{font-size:12.5px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-dim);cursor:pointer}
  /* 実走メモ */
  .mform{position:absolute;left:0;right:0;bottom:0;z-index:40;max-height:88vh;background:var(--panel);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(101%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);padding:0 0 calc(env(safe-area-inset-bottom) + 14px);
    display:flex;flex-direction:column}
  .mform.open{transform:translateY(0)}
  .mform h3{margin:0;font-size:16px;padding:6px 16px 4px}
  .mbody{overflow-y:auto;padding:6px 16px;-webkit-overflow-scrolling:touch}
  .mfield{margin-top:11px}
  .mfield label{display:block;font-size:11.5px;color:var(--ink-dim);margin-bottom:4px;letter-spacing:.04em}
  .mfield input[type=text],.mfield input[type=date],.mfield select,.mfield textarea{
    width:100%;font-size:15px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;outline:none;font-family:var(--sans)}
  .mfield textarea{min-height:68px;resize:vertical}
  .mstars{display:flex;gap:5px}
  .mstars span{font-size:26px;color:#3a4450;cursor:pointer;line-height:1}
  .mstars span.on{color:var(--accent)}
  .mgps{display:flex;gap:8px;align-items:center}
  .mgps .co{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .mactions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
  .mactions button{flex:1;justify-content:center;min-width:88px}
  .mcard{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:8px}
  .mcard .mh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .mcard .mh b{font-size:14px}
  .mcard .md{font-size:11px;color:var(--ink-dim);font-family:var(--mono)}
  .mcard .mmeta{font-size:12.5px;color:var(--ink-dim);margin-top:4px;line-height:1.5}
  .mcard .mbtns{display:flex;gap:6px;margin-top:8px}
  .mcard .mbtns button{font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}.sheet{transition:none}.mform{transition:none}}
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <div class="brand"><b>長野</b>林道カルテ</div>
  <div class="grow"></div>
  <button id="searchBtn">🔍</button>
  <button id="lv0Btn" class="on">Lv0表示中</button>
  <button id="karteBtn" class="kon">カルテ表示中</button>
  <button id="memoBtn" title="実走メモ">📝</button>
  <button id="gps">📍</button>
</div>

<div class="searchwrap" id="searchwrap" hidden>
  <input id="q" type="search" placeholder="林道名で検索…" autocomplete="off" />
  <div class="sresults" id="sresults"></div>
  <div class="filters">
    <select id="fCity"><option value="">全市町村</option></select>
    <select id="fThrough"><option value="">通行：全て</option><option value="完抜可">完抜可</option><option value="ピストン">ピストン</option><option value="通行止">通行止</option></select>
    <select id="fWinter"><option value="">冬季：全て</option><option value="y">冬季閉鎖あり</option><option value="n">通年/記載なし</option></select>
    <button id="fClear" class="fclear">クリア</button>
  </div>
</div>

<button id="fetch" class="fetch primary">この範囲の林道を取得（OSM）</button>

<div class="dock">
  <div class="row">
    <div class="layers">
      <div class="chip" data-base="std">地理院</div>
      <div class="chip sel" data-base="pale">淡色</div>
      <div class="chip" data-base="photo">航空写真</div>
    </div>
    <div class="grow"></div>
    <div class="stat" id="stat">カルテ <b>0</b></div>
  </div>
  <div class="row legend">
    <div class="key"><span class="dot"></span>カルテ</div>
    <div class="key"><span class="swatch" style="border-top-color:var(--unpaved)"></span>未舗装確定</div>
    <div class="key"><span class="swatch" style="border-top-color:var(--unpaved-inf);border-top-style:dashed"></span>未舗装推定</div>
    <div class="key"><span class="swatch" style="border-top-color:var(--paved)"></span>舗装</div>
    <div class="key"><span class="swatch" style="border-top-color:var(--unknown);border-top-style:dotted"></span>不明</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <div class="sheet-title"><h2 id="sh-name">—</h2><div class="sub" id="sh-sub">—</div></div>
    <div class="xbtn" id="sh-close">✕</div>
  </div>
  <div class="sheet-actions">
    <button class="primary" id="sh-nav">🧭 概略地点へナビ</button>
    <button id="sh-copy">座標コピー</button>
    <button id="sh-share">🔗 共有</button>
  </div>
  <div class="sheet-body" id="sh-body"></div>
</div>

<div class="mform" id="mform">
  <div class="grip"></div>
  <h3 id="mf-title">実走メモ</h3>
  <div class="mbody">
    <div class="mfield"><label>林道名</label><input type="text" id="mf-name" placeholder="林道名（未収録路線は自由入力）" /></div>
    <div class="mfield"><label>走行日</label><input type="date" id="mf-date" /></div>
    <div class="mfield"><label>現在地（GPS）</label><div class="mgps"><button class="pbtn nav" id="mf-gps" style="flex:none;padding:8px 12px">📍 現在地を取得</button><span class="co" id="mf-coord">—</span></div></div>
    <div class="mfield"><label>路面</label><select id="mf-surface"><option value="">—</option><option>舗装</option><option>フラットダート</option><option>やや荒れたダート</option><option>ガレ場・荒れ</option><option>ぬかるみ・泥濘</option><option>雪・凍結</option></select></div>
    <div class="mfield"><label>難易度</label><select id="mf-diff"><option value="">—</option><option>初級</option><option>中級</option><option>上級</option></select></div>
    <div class="mfield"><label>通行</label><select id="mf-through"><option value="">—</option><option>完抜けOK</option><option>ピストン（行止り）</option><option>一部通行止</option><option>全面通行止</option></select></div>
    <div class="mfield"><label>景色</label><div class="mstars" id="mf-scenery" data-v="0"></div></div>
    <div class="mfield"><label>おすすめ度</label><div class="mstars" id="mf-rating" data-v="0"></div></div>
    <div class="mfield"><label>自由メモ</label><textarea id="mf-memo" placeholder="路面の様子・分岐・ゲート・危険箇所など"></textarea></div>
  </div>
  <div class="mactions">
    <button class="primary" id="mf-save">保存</button>
    <button id="mf-cancel">キャンセル</button>
  </div>
</div>

<div class="mform" id="mlist">
  <div class="grip"></div>
  <h3>実走メモ一覧 <span id="ml-count" style="color:var(--ink-dim);font-size:12px"></span></h3>
  <div class="mbody" id="ml-body"></div>
  <div class="mactions">
    <button class="kon" id="ml-new">📍 現在地で新規</button>
    <button id="ml-export">エクスポート</button>
    <button id="ml-close">閉じる</button>
  </div>
</div>

<script>

const PAVED_S=new Set(["paved","asphalt","concrete","concrete:plates","paving_stones","sett","chipseal","metal","wood"]);
const UNPAVED_S=new Set(["unpaved","gravel","fine_gravel","compacted","dirt","earth","ground","mud","sand","grass","grass_paver","pebblestone","rock","stone","woodchips"]);
function classify(t){
  const s=(t.surface||"").toLowerCase(), tt=(t.tracktype||"").toLowerCase();
  if(PAVED_S.has(s))return"paved";
  if(UNPAVED_S.has(s))return"unpaved";
  if(tt==="grade1")return"paved";
  if(["grade2","grade3","grade4","grade5"].includes(tt))return"unpaved_inf";
  if((t.highway||"")==="track")return"unpaved_inf";
  return"unknown";
}

const empty={type:"FeatureCollection",features:[]};
function karteFC(){
  // KARTE_LINES（実線形）がある路線は、他セグメントと繋がっていない末端＝実際の入口/出口にピンを立てる。
  // 入口が複数（分岐・複数本の構成way等）ある場合はそのまま重複ピンとして許容する。
  // 線形データが無い路線は従来通り概略座標(coord_approx)1点にフォールバック（座標の捏造はしない）。
  const segsById={};
  (typeof KARTE_LINES!=="undefined"?KARTE_LINES.features:[]).forEach(f=>{
    const coords=f.geometry&&f.geometry.coordinates;
    if(!coords||coords.length<2)return;
    (segsById[f.properties.id]=segsById[f.properties.id]||[]).push([coords[0],coords[coords.length-1]]);
  });
  const features=[];
  MASTER.master.forEach(m=>{
    const segs=segsById[m.id];
    if(segs&&segs.length){
      const key=c=>c[0].toFixed(5)+","+c[1].toFixed(5);
      const count={};
      segs.forEach(pair=>pair.forEach(c=>{const k=key(c);count[k]=(count[k]||0)+1;}));
      const ends=[],seen=new Set();
      segs.forEach(pair=>pair.forEach(c=>{const k=key(c);if(count[k]===1&&!seen.has(k)){seen.add(k);ends.push(c);}}));
      if(ends.length){
        ends.forEach(c=>features.push({type:"Feature",geometry:{type:"Point",coordinates:c},properties:{id:m.id,name:m.name}}));
        return;
      }
    }
    features.push({type:"Feature",geometry:{type:"Point",coordinates:m.coord_approx},properties:{id:m.id,name:m.name}});
  });
  return {type:"FeatureCollection",features};
}
function lv0FC(){
  // k=true（カルテ済み）はカルテピンと重複するため地図上は非表示（CSV/データには残る）
  return {type:"FeatureCollection",features:LV0.filter(r=>!r.k).map(r=>({
    type:"Feature",geometry:{type:"Point",coordinates:r.c},
    properties:{id:r.i,name:r.n,src:r.s,ways:r.w,v:!!r.v}}))};
}

/* ===== OSM取得 ===== */
const OVERPASS="https://overpass-api.de/api/interpreter";
const btnFetch=document.getElementById("fetch");
btnFetch.onclick=fetchRindo;
async function fetchRindo(){
  const b=map.getBounds(),s=b.getSouth(),w=b.getWest(),n=b.getNorth(),e=b.getEast();
  if((n-s)*(e-w)>0.35){toast("範囲が広すぎます。走る林道あたりまでズームインしてから取得してください");return;}
  setBusy(true,"OSM林道を取得中…");
  const q=`[out:json][timeout:60];(way["highway"="track"](${s},${w},${n},${e});way["highway"="unclassified"]["tracktype"](${s},${w},${n},${e}););out geom tags;`;
  try{
    const res=await fetch(OVERPASS,{method:"POST",body:"data="+encodeURIComponent(q)});
    if(!res.ok)throw new Error("Overpass "+res.status);
    const fc=toGeoJSON(await res.json());
    map.getSource("rindo").setData(fc);
    toast(fc.features.length?`OSM林道 ${fc.features.length} 本を表示`:"この範囲にOSM林道データはありませんでした");
  }catch(err){toast("取得失敗: "+err.message);}finally{setBusy(false);}
}
function toGeoJSON(json){
  const f=[];
  for(const el of json.elements){
    if(el.type!=="way"||!el.geometry)continue;
    const t=el.tags||{};
    f.push({type:"Feature",geometry:{type:"LineString",coordinates:el.geometry.map(g=>[g.lon,g.lat])},
      properties:{id:el.id,name:t.name||"",tier:classify(t),tags:JSON.stringify(t)}});
  }
  return {type:"FeatureCollection",features:f};
}

/* ===== GPS ===== */
// gpsState: "off" → 位置情報オフ / "show" → 現在地表示のみ（地図は自由に移動可） / "follow" → 追従（地図が現在地に追従）
let watchId=null, gpsState="off", lastPos=null;
const btnGps=document.getElementById("gps");
function setGpsState(s){
  gpsState=s;
  btnGps.classList.toggle("on", s!=="off");
  btnGps.classList.toggle("show", s==="show");
  btnGps.textContent = s==="follow" ? "📍追従中" : s==="show" ? "📍表示中" : "📍";
}
btnGps.onclick=()=>{
  if(gpsState==="off"){
    if(!navigator.geolocation){toast("この端末は位置情報に対応していません");return;}
    setGpsState("follow");
    watchId=navigator.geolocation.watchPosition(onPos,onGpsErr,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
  }else if(gpsState==="follow"){
    setGpsState("show");
    if(lastPos)map.easeTo({center:lastPos,duration:300});
  }else{
    navigator.geolocation.clearWatch(watchId);watchId=null;lastPos=null;
    setGpsState("off");
    if(map.getSource("me"))map.getSource("me").setData(empty);
  }
};
function onPos(p){
  const {longitude:lon,latitude:lat,accuracy:acc}=p.coords;
  lastPos=[lon,lat];
  const data={type:"FeatureCollection",features:[
    {type:"Feature",geometry:{type:"Point",coordinates:[lon,lat]},properties:{t:"acc",r:Math.min(70,acc/3)}},
    {type:"Feature",geometry:{type:"Point",coordinates:[lon,lat]},properties:{t:"dot"}}]};
  if(map.getSource("me"))map.getSource("me").setData(data);
  if(gpsState==="follow")map.easeTo({center:[lon,lat],duration:600});
}
function onGpsErr(e){toast("位置情報エラー: "+(e.code===1?"アクセス拒否（HTTPSで開く必要あり）":e.message));
  setGpsState("off");watchId=null;}
// 追従中にユーザーがドラッグ操作したら追従を自動解除（現在地ドットは表示継続）
map.on("dragstart",()=>{ if(gpsState==="follow"){ setGpsState("show"); } });

function karteMatch(m){
  if(FILT.city&&cityKey(m.city)!==FILT.city)return false;

  fnTarget=Object.assign({targetId:null,name:"",lat:null,lng:null},target||{});
  fnEditId=editNote?editNote.id:null;
  const g=id=>document.getElementById(id);
  g("mf-title").textContent=editNote?"実走メモを編集":"実走メモ";
  g("mf-name").value=editNote?editNote.name:(fnTarget.name||"");
  g("mf-date").value=(editNote&&editNote.date)||new Date().toISOString().slice(0,10);
  g("mf-surface").value=editNote?(editNote.surface||""):"";
  g("mf-diff").value=editNote?(editNote.difficulty||""):"";
  g("mf-through").value=editNote?(editNote.through||""):"";
  fnSetStars(g("mf-scenery"),editNote?editNote.scenery:0);
  fnSetStars(g("mf-rating"),editNote?editNote.rating:0);
  g("mf-memo").value=editNote?(editNote.memo||""):"";
  const lat=editNote?editNote.lat:fnTarget.lat, lng=editNote?editNote.lng:fnTarget.lng;
  fnTarget.lat=lat; fnTarget.lng=lng;
  g("mf-coord").textContent=(lat!=null&&lng!=null)?`${(+lat).toFixed(5)}, ${(+lng).toFixed(5)}`:"未取得";
  mlist.classList.remove("open"); sheet.classList.remove("open"); mform.classList.add("open");
}
document.getElementById("mf-gps").onclick=()=>{
  if(!navigator.geolocation){toast("この端末は位置情報に非対応");return;}
  toast("現在地を取得中…");
  navigator.geolocation.getCurrentPosition(p=>{
    fnTarget.lat=p.coords.latitude; fnTarget.lng=p.coords.longitude;
    document.getElementById("mf-coord").textContent=`${fnTarget.lat.toFixed(5)}, ${fnTarget.lng.toFixed(5)}`;
    toast("現在地を取得しました");
  },e=>toast("取得失敗: "+(e.code===1?"アクセス拒否（HTTPSで許可を）":e.message)),{enableHighAccuracy:true,timeout:15000});
};
document.getElementById("mf-cancel").onclick=()=>mform.classList.remove("open");
document.getElementById("mf-save").onclick=()=>{
  const g=id=>document.getElementById(id);
  const note={ id:fnEditId||("fn"+Date.now()), targetId:fnTarget.targetId||null,
    name:g("mf-name").value.trim()||"(名称未記入)", date:g("mf-date").value||null,
    lat:fnTarget.lat!=null?+(+fnTarget.lat).toFixed(6):null, lng:fnTarget.lng!=null?+(+fnTarget.lng).toFixed(6):null,
    surface:g("mf-surface").value||null, difficulty:g("mf-diff").value||null, through:g("mf-through").value||null,
    scenery:+g("mf-scenery").dataset.v||null, rating:+g("mf-rating").dataset.v||null,
    memo:g("mf-memo").value.trim()||null, ts:new Date().toISOString() };
  if(fnEditId){ const ix=FN.findIndex(x=>x.id===fnEditId); if(ix>=0)FN[ix]=note; } else FN.push(note);
  fnStore(FN); fnRefreshMap(); mform.classList.remove("open");
  toast("実走メモを保存しました（この端末に保存）");
  if(curKarte&&note.targetId===curKarte.id)renderKarteMemos(curKarte.id);
  if(mlist.classList.contains("open"))renderMemoList();
};

function fnStars(v){ return v?"★".repeat(v):""; }
function fnCard(n){
  const st=(k,v)=>v?`${k}:${v}`:"";
  const meta=[st("路面",n.surface),st("難",n.difficulty),st("通行",n.through),n.scenery?"景"+fnStars(n.scenery):"",n.rating?"推"+fnStars(n.rating):""].filter(Boolean).join(" ・ ");
  return `<div class="mcard" data-id="${n.id}">
    <div class="mh"><b>${n.name}</b><span class="md">${n.date||""}</span></div>
    ${meta?`<div class="mmeta">${meta}</div>`:""}
    ${n.memo?`<div class="mmeta" style="color:var(--ink)">${n.memo}</div>`:""}
    ${n.lat!=null?`<div class="md">${(+n.lat).toFixed(5)}, ${(+n.lng).toFixed(5)}</div>`:""}
    <div class="mbtns"><button data-act="edit">編集</button>${n.lat!=null?'<button data-act="nav">🧭ナビ</button>':""}<button data-act="del">削除</button></div>
  </div>`;
}
function fnWireCards(box){
  box.querySelectorAll(".mcard").forEach(card=>{
    const id=card.dataset.id, n=FN.find(x=>x.id===id); if(!n)return;
    card.querySelector('[data-act="edit"]').onclick=()=>openMemoForm({targetId:n.targetId,name:n.name,lat:n.lat,lng:n.lng},n);
    const nav=card.querySelector('[data-act="nav"]'); if(nav)nav.onclick=()=>navTo(n.lat,n.lng);
    card.querySelector('[data-act="del"]').onclick=()=>{ if(confirm("このメモを削除しますか？")){ FN=FN.filter(x=>x.id!==id); fnStore(FN); fnRefreshMap();
      if(box.id==="ml-body")renderMemoList(); else if(curKarte)renderKarteMemos(curKarte.id); } };
  });
}
function renderKarteMemos(id){
  const box=document.getElementById("sh-memos"); if(!box)return;
  const mine=FN.filter(n=>n.targetId===id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  box.innerHTML=mine.length?mine.map(fnCard).join(""):`<div style="color:var(--ink-dim);font-size:12.5px">まだ実走メモはありません。走行中にこの端末へ記録できます（オフライン可）。</div>`;
  fnWireCards(box);
}
function renderMemoList(){
  const box=document.getElementById("ml-body");
  const all=[...FN].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
  document.getElementById("ml-count").textContent=`(${all.length}件)`;
  box.innerHTML=all.length?all.map(fnCard).join(""):`<div style="color:var(--ink-dim);font-size:13px;padding:10px 0;line-height:1.6">まだ実走メモはありません。<br>地図上の林道ピンやカルテの「📝 実走メモを追加」、または下の「📍 現在地で新規」で記録できます。<br>すべて<b>この端末内に保存</b>され、電波の無い山中でもオフラインで使えます。あとで「エクスポート」してマスターへ反映できます。</div>`;
  fnWireCards(box);
}
document.getElementById("memoBtn").onclick=()=>{ sheet.classList.remove("open"); mform.classList.remove("open"); renderMemoList(); mlist.classList.add("open"); };
document.getElementById("ml-close").onclick=()=>mlist.classList.remove("open");
document.getElementById("ml-new").onclick=()=>openMemoForm({targetId:null,name:"",lat:null,lng:null});
document.getElementById("ml-export").onclick=()=>{
  if(!FN.length){toast("メモがありません");return;}
  const data=JSON.stringify(FN,null,2);
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(data).then(()=>toast(`${FN.length}件をJSONでクリップボードにコピー`),()=>fnDownload(data));
  else fnDownload(data);
};
function fnDownload(data){ try{ const b=new Blob([data],{type:"application/json"}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download="rindo_field_notes.json"; a.click(); URL.revokeObjectURL(u); toast("JSONをダウンロードしました");
}catch(_){toast("エクスポート失敗");} }
window.fnAddFor=id=>{ const k=KARTE_BY_ID[id], l=LV0_BY_ID[id];
  if(k)openMemoForm({targetId:id,name:k.name,lat:k.coord_approx[1],lng:k.coord_approx[0]});
  else if(l)openMemoForm({targetId:id,name:l.n,lat:l.c[1],lng:l.c[0]}); };

/* ===== Service Worker 登録（PWA・オフライン） ===== */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
