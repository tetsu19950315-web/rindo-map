<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>長野 林道カルテマップ</title>
<meta name="theme-color" content="#12161b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#12161b; --panel:#1b2129; --panel-2:#232b35; --line:#333e4a;
    --ink:#e8edf2; --ink-dim:#95a1af; --accent:#ff8a00;
    --paved:#6b7a8f; --unpaved:#ff8a00; --unpaved-inf:#ffb347; --unknown:#9aa0a6; --me:#1e90ff;
    --karte:#22d3a5;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  #map{position:absolute;inset:0}

  .bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;
       padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;pointer-events:none}
  .bar > *{pointer-events:auto}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-dim);
         background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;
         display:flex;align-items:center;gap:7px;white-space:nowrap}
  .brand b{color:var(--karte);font-weight:600}
  .grow{flex:1}
  button{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--panel);
         border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;
         display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  button:active{background:var(--panel-2)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#1a1204;font-weight:600}
  button.on{background:var(--me);border-color:var(--me);color:#04121f;font-weight:600}
  button.kon{background:var(--karte);border-color:var(--karte);color:#04140f;font-weight:600}

  .fetch{position:absolute;left:50%;transform:translateX(-50%);z-index:5;
         bottom:calc(env(safe-area-inset-bottom) + 152px)}

  .dock{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;
        background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .row{display:flex;align-items:center;gap:8px}
  .row + .row{margin-top:9px}
  .layers{display:flex;gap:6px}
  .chip{font-size:12.5px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);
        background:var(--panel-2);color:var(--ink-dim);cursor:pointer}
  .chip.sel{background:var(--ink);color:#0f1419;border-color:var(--ink);font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:9px 13px;font-size:11.5px;color:var(--ink-dim)}
  .key{display:flex;align-items:center;gap:6px}
  .swatch{width:20px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--karte);border:2px solid #04140f}
  .stat{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim)}
  .stat b{color:var(--ink);font-weight:600}

  .toast{position:absolute;left:50%;transform:translateX(-50%);z-index:20;
         top:calc(env(safe-area-inset-top) + 62px);
         background:#0c0f13ee;border:1px solid var(--line);border-radius:9px;padding:10px 14px;
         font-size:13px;max-width:88vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .spin{width:14px;height:14px;border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;
        display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* カルテ ボトムシート */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;max-height:82vh;
         background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
         transform:translateY(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
         padding:0 0 calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column}
  .sheet.open{transform:translateY(0)}
  .grip{width:38px;height:4px;background:var(--line);border-radius:3px;margin:9px auto 4px}
  .sheet-head{display:flex;align-items:flex-start;gap:10px;padding:4px 16px 10px;border-bottom:1px solid var(--line)}
  .sheet-title{flex:1}
  .sheet-title h2{margin:0;font-size:18px}
  .sheet-title .sub{color:var(--ink-dim);font-size:12.5px;margin-top:3px}
  .xbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;
        display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink-dim);cursor:pointer;flex:none}
  .sheet-body{overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .badge{font-size:12px;padding:4px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink)}
  .badge.warn{border-color:#7a5a12;background:#2a2210;color:#ffd27a}
  .badge.diff{border-color:#3a4a5a}

  .grid{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;align-items:baseline}
  .grid .k{color:var(--ink-dim);white-space:nowrap}
  .grid .v{color:var(--ink)}
  .grid .v.mono{font-family:var(--mono)}
  .stars{color:var(--accent);letter-spacing:1px}
  .stars .off{color:#3a4450}
  .sect{margin:15px 0 7px;font-size:11px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}
  .notes{font-size:13px;line-height:1.6;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
         border-radius:9px;padding:10px 12px;margin-top:4px}
  .src{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:7px}
  .src .st{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .src .type{font-size:11px;color:var(--karte);font-family:var(--mono)}
  .src a{color:#5db4ff;font-size:13px;text-decoration:none;word-break:break-all}
  .src .memo{color:var(--ink-dim);font-size:12px;margin-top:4px;line-height:1.5}
  .sheet-actions{display:flex;gap:8px;padding:10px 16px 0}
  .sheet-actions button{flex:1;justify-content:center}
  .verify{font-size:11.5px;color:#ffd27a;background:#2a2210;border:1px solid #7a5a12;border-radius:8px;
          padding:8px 11px;margin-top:12px;line-height:1.5}

  .maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;font-family:var(--sans);font-size:13px;padding:11px 13px;min-width:150px}
  .maplibregl-popup-content b{color:var(--accent)}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  .prow{display:flex;justify-content:space-between;gap:14px;margin-top:3px}
  .pk{color:var(--ink-dim)} .pv{color:var(--ink)}
  .pbtns{display:flex;gap:7px;margin-top:10px}
  .pbtn{flex:1;font-size:12.5px;padding:8px 6px;border-radius:7px;border:1px solid var(--line);
        background:var(--panel-2);color:var(--ink);cursor:pointer}
  .pbtn.nav{background:var(--me);border-color:var(--me);color:#04121f;font-weight:600}
  .searchwrap{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:10px;right:10px;z-index:6;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 24px #0008}
  .searchwrap[hidden]{display:none}
  .searchwrap input#q{width:100%;font-size:15px;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
  .searchwrap input#q::placeholder{color:var(--ink-dim)}
  .sresults{margin-top:6px;max-height:38vh;overflow-y:auto;display:none}
  .sitem{padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sitem:active{background:var(--panel-2)}
  .sitem .stype{font-size:10.5px;color:var(--ink-dim);font-family:var(--mono);flex:none}
  .sitem.muted{color:var(--ink-dim);cursor:default}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .filters select{flex:1;min-width:86px;font-size:12.5px;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:7px;padding:7px 8px;outline:none}
  .fclear{font-size:12.5px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-dim);cursor:pointer}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}.sheet{transition:none}}
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <div class="brand"><b>長野</b>林道カルテ</div>
  <div class="grow"></div>
  <button id="searchBtn">🔍</button>
  <button id="lv0Btn" class="on">Lv0表示中</button>
  <button id="karteBtn" class="kon">カルテ表示中</button>
  <button id="gps">📍</button>
</div>

<div class="searchwrap" id="searchwrap" hidden>
  <input id="q" type="search" placeholder="林道名で検索…" autocomplete="off" />
  <div class="sresults" id="sresults"></div>
  <div class="filters">
    <select id="fCity"><option value="">全市町村</option></select>
    <select id="fThrough"><option value="">通行：全て</option><option value="完抜可">完抜可</option><option value="ピストン">ピストン</option><option value="通行止">通行止</option></select>
    <select id="fWinter"><option value="">冬季：全て</option><option value="y">冬季閉鎖あり</option><option value="n">通年/記載なし</option></select>
    <button id="fClear" class="fclear">クリア</button>
  </div>
</div>

<button id="fetch" class="fetch primary">この範囲の林道を取得（OSM）</button>

<div class="dock">
  <div class="row">
    <div class="layers">
      <div class="chip" data-base="std">地理院</div>
      <div class="chip sel" data-base="pale">淡色</div>
      <div class="chip" data-base="photo">航空写真</div>
    </div>
    <div class="grow"></div>
    <div class="stat" id="stat">カルテ <b>0</b></div>
  </div>
  <div class="row legend">
    <div class="key"><span class="dot"></span>カルテ</div>
    <div class="key"><span class="swatch" style="border-top-color:var(--unpaved)"></span>未舗装確定</div>
    <div class="key"><span class="swatch" style="border-top-color:var(--unpaved-inf);border-top-style:dashed"></span>未舗装推定</div>
    <div class="key"><span class="swatch" style="border-top-color:var(--paved)"></span>舗装</div>
    <div class="key"><span class="swatch" style="border-top-color:var(--unknown);border-top-style:dotted"></span>不明</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <div class="sheet-title"><h2 id="sh-name">—</h2><div class="sub" id="sh-sub">—</div></div>
    <div class="xbtn" id="sh-close">✕</div>
  </div>
  <div class="sheet-actions">
    <button class="primary" id="sh-nav">🧭 概略地点へナビ</button>
    <button id="sh-copy">座標コピー</button>
    <button id="sh-share">🔗 共有</button>
  </div>
  <div class="sheet-body" id="sh-body"></div>
</div>

<script>
/* ===== 長野 林道マスター（rindo-nagano-master.json と同内容を埋め込み） ===== */

function baseStyle(key){
  const b=GSI[key];
  return {version:8,glyphs:"https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources:{base:{type:"raster",tiles:b.tiles,tileSize:256,maxzoom:b.max,attribution:b.attr}},

}

/* ===== 分類 ===== */
const PAVED_S=new Set(["paved","asphalt","concrete","concrete:plates","paving_stones","sett","chipseal","metal","wood"]);
const UNPAVED_S=new Set(["unpaved","gravel","fine_gravel","compacted","dirt","earth","ground","mud","sand","grass","grass_paver","pebblestone","rock","stone","woodchips"]);
function classify(t){
  const s=(t.surface||"").toLowerCase(), tt=(t.tracktype||"").toLowerCase();
  if(PAVED_S.has(s))return"paved";
  if(UNPAVED_S.has(s))return"unpaved";
  if(tt==="grade1")return"paved";
  if(["grade2","grade3","grade4","grade5"].includes(tt))return"unpaved_inf";
  if((t.highway||"")==="track")return"unpaved_inf";
  return"unknown";
}

const empty={type:"FeatureCollection",features:[]};
function karteFC(){
  return {type:"FeatureCollection",features:MASTER.master.map(m=>({
    type:"Feature",geometry:{type:"Point",coordinates:m.coord_approx},
    properties:{id:m.id,name:m.name}}))};
}
function lv0FC(){
  // k=true（カルテ済み）はカルテピンと重複するため地図上は非表示（CSV/データには残る）
  return {type:"FeatureCollection",features:LV0.filter(r=>!r.k).map(r=>({
    type:"Feature",geometry:{type:"Point",coordinates:r.c},
    properties:{id:r.i,name:r.n,src:r.s,ways:r.w,v:!!r.v}}))};
}

function addLayers(){
  if(map.getSource("rindo"))return;
  map.addSource("rindo",{type:"geojson",data:empty});
  const W=["interpolate",["linear"],["zoom"],11,1.6,14,3.2,17,6];
  map.addLayer({id:"r-paved",type:"line",source:"rindo",filter:["==",["get","tier"],"paved"],paint:{"line-color":"#6b7a8f","line-width":W}});
  map.addLayer({id:"r-unknown",type:"line",source:"rindo",filter:["==",["get","tier"],"unknown"],paint:{"line-color":"#9aa0a6","line-width":W,"line-dasharray":[1,2]}});
  map.addLayer({id:"r-unpaved-inf",type:"line",source:"rindo",filter:["==",["get","tier"],"unpaved_inf"],paint:{"line-color":"#ffb347","line-width":W,"line-dasharray":[2,1.4]}});
  map.addLayer({id:"r-unpaved",type:"line",source:"rindo",filter:["==",["get","tier"],"unpaved"],paint:{"line-color":"#ff8a00","line-width":["interpolate",["linear"],["zoom"],11,2,14,4,17,7]}});
  map.addLayer({id:"r-label",type:"symbol",source:"rindo",minzoom:13,layout:{"symbol-placement":"line","text-field":["get","name"],"text-size":11,"text-font":["Noto Sans Regular"],"text-max-angle":40},paint:{"text-color":"#ffe9c9","text-halo-color":"#12161b","text-halo-width":1.6}});

  // Lv0（骨格列挙・カルテの下に描画）
  map.addSource("lv0",{type:"geojson",data:lv0FC()});
  map.addLayer({id:"lv0-dot",type:"circle",source:"lv0",paint:{"circle-radius":["case",["get","v"],["interpolate",["linear"],["zoom"],7,3,12,6],["interpolate",["linear"],["zoom"],7,2,12,4.5]],"circle-color":["case",["get","v"],"#ffd166","#5db4ff"],"circle-opacity":0.85,"circle-stroke-width":1,"circle-stroke-color":"#0a1a2a"}});
  map.addLayer({id:"lv0-label",type:"symbol",source:"lv0",minzoom:12,layout:{"text-field":["get","name"],"text-size":10.5,"text-font":["Noto Sans Regular"],"text-offset":[0,1.1],"text-anchor":"top","text-allow-overlap":false},paint:{"text-color":"#bcd9f7","text-halo-color":"#0c1420","text-halo-width":1.6}});

  // カルテ
  map.addSource("karte",{type:"geojson",data:karteFC()});
  map.addLayer({id:"k-halo",type:"circle",source:"karte",paint:{"circle-radius":11,"circle-color":"#22d3a5","circle-opacity":0.22}});
  map.addLayer({id:"k-dot",type:"circle",source:"karte",paint:{"circle-radius":6,"circle-color":"#22d3a5","circle-stroke-width":2,"circle-stroke-color":"#04140f"}});
  map.addLayer({id:"k-label",type:"symbol",source:"karte",layout:{"text-field":["get","name"],"text-size":12,"text-font":["Noto Sans Regular"],"text-offset":[0,1.3],"text-anchor":"top","text-allow-overlap":false},paint:{"text-color":"#c9ffe9","text-halo-color":"#0c1a14","text-halo-width":1.8}});

  // GPS
  map.addSource("me",{type:"geojson",data:empty});
  map.addLayer({id:"me-acc",type:"circle",source:"me",filter:["==",["get","t"],"acc"],paint:{"circle-radius":["get","r"],"circle-color":"#1e90ff","circle-opacity":0.12}});
  map.addLayer({id:"me-dot",type:"circle",source:"me",filter:["==",["get","t"],"dot"],paint:{"circle-radius":7,"circle-color":"#1e90ff","circle-stroke-width":2.5,"circle-stroke-color":"#fff"}});

  ["k-dot","k-halo","k-label"].forEach(id=>{
    map.on("click",id,e=>openKarte(e.features[0].properties.id));
    map.on("mouseenter",id,()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave",id,()=>map.getCanvas().style.cursor="");
  });
  ["r-paved","r-unknown","r-unpaved-inf","r-unpaved"].forEach(id=>{
    map.on("click",id,onLineClick);
    map.on("mouseenter",id,()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave",id,()=>map.getCanvas().style.cursor="");
  });
  map.on("click","lv0-dot",e=>{
    const rec=LV0_BY_ID[e.features[0].properties.id];
    if(rec)openLv0Popup(rec);
  });
  map.on("mouseenter","lv0-dot",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","lv0-dot",()=>map.getCanvas().style.cursor="");
  document.getElementById("stat").innerHTML=`カルテ <b>${MASTER.master.length}</b> ・ Lv0 <b>${LV0.length}</b> ・ Lv1候補 <b>${LV0.filter(r=>r.v).length}</b>`;
  if(typeof applyKarteFilters==="function")applyKarteFilters();
}
map.on("load",addLayers);

/* ===== カルテ ボトムシート ===== */
const sheet=document.getElementById("sheet");
let curKarte=null;
function stars(n){ if(n==null)return"—"; let s=""; for(let i=1;i<=5;i++)s+= i<=n?"★":'<span class="off">★</span>'; return `<span class="stars">${s}</span>`; }
function row(k,v){ return v!=null&&v!==""?`<div class="k">${k}</div><div class="v">${v}</div>`:""; }
function rowMono(k,v){ return v!=null&&v!==""?`<div class="k">${k}</div><div class="v mono">${v}</div>`:""; }

function openKarte(id){
  const m=MASTER.master.find(x=>x.id===id); if(!m)return;
  curKarte=m;
  document.getElementById("sh-name").textContent=m.name;
  document.getElementById("sh-sub").textContent=`${m.pref} ${m.city}　#${m.id}`;
  const srcs=MASTER.sources.filter(s=>s.rindo_id===id);
  const dirtInfo = m.total_km!=null ? `${m.total_km} km（うち未舗装 ${m.dirt_km!=null?m.dirt_km+" km":"—"}${m.dirt_pct!=null?" / "+m.dirt_pct+"%":""}）` : "—";
  const badges=[
    m.difficulty?`<span class="badge diff">難易度: ${m.difficulty}</span>`:"",
    m.through?`<span class="badge">${m.through}</span>`:"",
    m.winter_closed?`<span class="badge warn">${m.winter_closed}</span>`:"",
  ].join("");
  const body=`
    <div class="badges">${badges}</div>
    <div class="sect">走行データ</div>
    <div class="grid">
      ${row("総延長 / 未舗装",dirtInfo)}
      ${row("路面種別",m.surface_type)}
      ${row("推奨車種",m.vehicle)}
      ${row("完抜可否",m.through)}
    </div>
    <div class="sect">評価</div>
    <div class="grid">
      ${row("おすすめ度",stars(m.rating))}
      ${row("景色評価",stars(m.scenery))}
    </div>
    <div class="sect">通行・状況</div>
    <div class="grid">
      ${row("通行状況",m.status)}
      ${row("冬季閉鎖",m.winter_closed)}
    </div>
    <div class="sect">メタ情報</div>
    <div class="grid">
      ${row("最終確認日",m.last_checked)}
      ${row("情報信頼度",m.confidence)}
      ${row("情報源数",srcs.length)}
      ${rowMono("写真/動画",`${m.photos} / ${m.videos}`)}
      ${row("GPX",m.gpx?"あり":"なし")}
      ${rowMono("概略座標",`${m.coord_approx[1].toFixed(4)}, ${m.coord_approx[0].toFixed(4)}`)}
    </div>
    ${m.notes?`<div class="sect">備考</div><div class="notes">${m.notes}</div>`:""}
    <div class="sect">情報ソース（${srcs.length}）</div>
    ${srcs.map(s=>`<div class="src"><div class="st"><span class="type">${s.type}</span><span style="color:var(--ink-dim);font-size:11px">${s.checked}</span></div>
      <a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>
      ${s.memo?`<div class="memo">${s.memo}</div>`:""}</div>`).join("")}
    <div class="verify">⚠ 通行状況・冬季閉鎖・路面は頻繁に変わります。出発前に自治体/森林管理署の最新情報を確認し、走行可否は自己責任で判断してください。座標は概略です。現地では地図上のOSM林道ラインをタップして正確な入口座標を確認してください。</div>
  `;
  document.getElementById("sh-body").innerHTML=body;
  sheet.classList.add("open");
}
document.getElementById("sh-close").onclick=()=>sheet.classList.remove("open");
document.getElementById("sh-nav").onclick=()=>{ if(!curKarte)return;
  const [lng,lat]=curKarte.coord_approx;
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`,"_blank"); };
document.getElementById("sh-copy").onclick=()=>{ if(!curKarte)return;
  const [lng,lat]=curKarte.coord_approx, s=`${lat},${lng}`;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>toast("座標コピー: "+s),()=>toast(s));}
  else toast("コピー用: "+s); };

/* ===== OSMライン タップ ===== */
const TIER_JA={paved:"舗装（確定）",unpaved:"未舗装（確定）",unpaved_inf:"未舗装（推定）",unknown:"不明"};
function onLineClick(e){
  const p=e.features[0].properties, t=p.tags?JSON.parse(p.tags):{};
  const lat=e.lngLat.lat.toFixed(6),lng=e.lngLat.lng.toFixed(6);
  const L=(k,v)=>v?`<div class="prow"><span class="pk">${k}</span><span class="pv">${v}</span></div>`:"";
  const osm=p.id?`<div class="prow"><span class="pk">OSM</span><a class="pv" style="color:#5db4ff" target="_blank" href="https://www.openstreetmap.org/way/${p.id}">way/${p.id}</a></div>`:"";
  const html=`<b>${t.name||"（名称なし）"}</b>
    <div class="prow"><span class="pk">判定</span><span class="pv">${TIER_JA[p.tier]}</span></div>
    ${L("surface",t.surface)}${L("tracktype",t.tracktype)}${L("highway",t.highway)}${osm}
    <div class="prow"><span class="pk">地点</span><span class="pv" style="font-family:var(--mono)">${lat}, ${lng}</span></div>
    <div class="pbtns"><button class="pbtn nav" onclick="navTo(${lat},${lng})">🧭 ここへナビ</button>
    <button class="pbtn" onclick="copyCoord(${lat},${lng})">コピー</button></div>`;
  new maplibregl.Popup({closeButton:true,maxWidth:"260px"}).setLngLat(e.lngLat).setHTML(html).addTo(map);
}
window.navTo=(lat,lng)=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`,"_blank");
window.copyCoord=(lat,lng)=>{const s=`${lat},${lng}`;
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>toast("座標コピー: "+s),()=>toast(s));
  else toast("コピー用: "+s);};

/* ===== OSM取得 ===== */
const OVERPASS="https://overpass-api.de/api/interpreter";
const btnFetch=document.getElementById("fetch");
btnFetch.onclick=fetchRindo;
async function fetchRindo(){
  const b=map.getBounds(),s=b.getSouth(),w=b.getWest(),n=b.getNorth(),e=b.getEast();
  if((n-s)*(e-w)>0.35){toast("範囲が広すぎます。走る林道あたりまでズームインしてから取得してください");return;}
  setBusy(true,"OSM林道を取得中…");
  const q=`[out:json][timeout:60];(way["highway"="track"](${s},${w},${n},${e});way["highway"="unclassified"]["tracktype"](${s},${w},${n},${e}););out geom tags;`;
  try{
    const res=await fetch(OVERPASS,{method:"POST",body:"data="+encodeURIComponent(q)});
    if(!res.ok)throw new Error("Overpass "+res.status);
    const fc=toGeoJSON(await res.json());
    map.getSource("rindo").setData(fc);
    toast(fc.features.length?`OSM林道 ${fc.features.length} 本を表示`:"この範囲にOSM林道データはありませんでした");
  }catch(err){toast("取得失敗: "+err.message);}finally{setBusy(false);}
}
function toGeoJSON(json){
  const f=[];
  for(const el of json.elements){
    if(el.type!=="way"||!el.geometry)continue;
    const t=el.tags||{};
    f.push({type:"Feature",geometry:{type:"LineString",coordinates:el.geometry.map(g=>[g.lon,g.lat])},
      properties:{id:el.id,name:t.name||"",tier:classify(t),tags:JSON.stringify(t)}});
  }
  return {type:"FeatureCollection",features:f};
}

/* ===== カルテ表示トグル ===== */
let karteOn=true;
document.getElementById("karteBtn").onclick=()=>{
  karteOn=!karteOn;
  const v=karteOn?"visible":"none";
  ["k-halo","k-dot","k-label"].forEach(id=>map.getLayer(id)&&map.setLayoutProperty(id,"visibility",v));
  const b=document.getElementById("karteBtn");
  b.classList.toggle("kon",karteOn); b.textContent=karteOn?"カルテ表示中":"カルテ非表示";
};

/* ===== Lv0表示トグル ===== */
let lv0On=true;
document.getElementById("lv0Btn").onclick=()=>{
  lv0On=!lv0On;
  const v=lv0On?"visible":"none";
  ["lv0-dot","lv0-label"].forEach(id=>map.getLayer(id)&&map.setLayoutProperty(id,"visibility",v));
  const b=document.getElementById("lv0Btn");
  b.classList.toggle("on",lv0On); b.textContent=lv0On?"Lv0表示中":"Lv0非表示";

/* ===== ベース切替 ===== */
document.querySelectorAll(".chip").forEach(ch=>{
  ch.onclick=()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel")); ch.classList.add("sel");
    const rd=map.getSource("rindo")&&map.getSource("rindo")._data;
    const me=map.getSource("me")&&map.getSource("me")._data;
    map.setStyle(baseStyle(ch.dataset.base));
    map.once("styledata",()=>{addLayers(); if(rd)map.getSource("rindo").setData(rd); if(me)map.getSource("me").setData(me);
      if(!karteOn)["k-halo","k-dot","k-label"].forEach(id=>map.setLayoutProperty(id,"visibility","none"));
      if(!lv0On)["lv0-dot","lv0-label"].forEach(id=>map.setLayoutProperty(id,"visibility","none"));});
  };
});

/* ===== GPS ===== */
let watchId=null,following=false;
const btnGps=document.getElementById("gps");
btnGps.onclick=()=>{
  if(watchId===null){
    if(!navigator.geolocation){toast("この端末は位置情報に対応していません");return;}
    following=true; btnGps.classList.add("on"); btnGps.textContent="📍追従";
    watchId=navigator.geolocation.watchPosition(onPos,onGpsErr,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
  }else{
    navigator.geolocation.clearWatch(watchId);watchId=null;following=false;
    btnGps.classList.remove("on");btnGps.textContent="📍";
    if(map.getSource("me"))map.getSource("me").setData(empty);
  }
};
function onPos(p){
  const {longitude:lon,latitude:lat,accuracy:acc}=p.coords;
  const data={type:"FeatureCollection",features:[
    {type:"Feature",geometry:{type:"Point",coordinates:[lon,lat]},properties:{t:"acc",r:Math.min(70,acc/3)}},
    {type:"Feature",geometry:{type:"Point",coordinates:[lon,lat]},properties:{t:"dot"}}]};
  if(map.getSource("me"))map.getSource("me").setData(data);
  if(following)map.easeTo({center:[lon,lat],duration:600});
}
function onGpsErr(e){toast("位置情報エラー: "+(e.code===1?"アクセス拒否（HTTPSで開く必要あり）":e.message));
  btnGps.classList.remove("on");btnGps.textContent="📍";watchId=null;following=false;}

/* ===== UI ===== */
let toastT=null;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),3800);}
function setBusy(on,m){btnFetch.disabled=on;btnFetch.innerHTML=on?`<span class="spin"></span>${m}`:"この範囲の林道を取得（OSM）";}

/* ===== 検索・フィルタ・共有 ===== */
const KARTE_BY_ID={}; MASTER.master.forEach(m=>KARTE_BY_ID[m.id]=m);
const cityKey=c=>c?c.split(/[（(]/)[0]:"";
const throughCat=t=>!t?"":(/完抜/.test(t)?"完抜可":(/ピストン|行止|行き止/.test(t)?"ピストン":((/不可|通行止|廃道/.test(t))?"通行止":"")));
const FILT={city:"",through:"",winter:""};

(function(){
  const sel=document.getElementById("fCity");
  [...new Set(MASTER.master.map(m=>cityKey(m.city)).filter(Boolean))].sort().forEach(c=>{
    const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);});
})();

function karteMatch(m){
  if(FILT.city&&cityKey(m.city)!==FILT.city)return false;
  if(FILT.through&&throughCat(m.through)!==FILT.through)return false;
  if(FILT.winter==="y"&&!m.winter_closed)return false;
  if(FILT.winter==="n"&&m.winter_closed)return false;
  return true;
}
function applyKarteFilters(){
  const active=FILT.city||FILT.through||FILT.winter;
  const list=MASTER.master.filter(karteMatch);
  if(map.getSource("karte"))map.getSource("karte").setData({type:"FeatureCollection",
    features:list.map(m=>({type:"Feature",geometry:{type:"Point",coordinates:m.coord_approx},properties:{id:m.id,name:m.name}}))});
  const st=document.getElementById("stat");
  if(st)st.innerHTML=active
    ?`カルテ <b>${list.length}</b>/${MASTER.master.length} ・ Lv0 <b>${LV0.length}</b>`
    :`カルテ <b>${MASTER.master.length}</b> ・ Lv0 <b>${LV0.length}</b> ・ Lv1候補 <b>${LV0.filter(r=>r.v).length}</b>`;
}
["fCity","fThrough","fWinter"].forEach(id=>{
  const el=document.getElementById(id);
  el.onchange=()=>{FILT[id.replace("f","").toLowerCase()]=el.value;applyKarteFilters();};
});
document.getElementById("fClear").onclick=()=>{
  FILT.city="";FILT.through="";FILT.winter="";
  ["fCity","fThrough","fWinter"].forEach(id=>document.getElementById(id).value="");
  applyKarteFilters();
};

const SEARCH_IDX=[
  ...MASTER.master.map(m=>({name:m.name,id:m.id,type:"karte",c:m.coord_approx})),
  ...LV0.filter(r=>!r.k).map(r=>({name:r.n,id:r.i,type:"lv0",c:r.c}))
];
const qEl=document.getElementById("q"), resEl=document.getElementById("sresults");
qEl.addEventListener("input",()=>{
  const q=qEl.value.trim();
  if(!q){resEl.style.display="none";resEl.innerHTML="";return;}
  const hits=SEARCH_IDX.filter(x=>x.name.includes(q)).slice(0,12);
  resEl.innerHTML=hits.length
    ?hits.map(h=>`<div class="sitem" data-id="${h.id}" data-c="${h.c[0]},${h.c[1]}" data-type="${h.type}"><span>${h.name}</span><span class="stype">${h.type==="karte"?"カルテ":"Lv0"}</span></div>`).join("")
    :`<div class="sitem muted">該当なし</div>`;
  resEl.style.display="block";
});
resEl.addEventListener("click",e=>{
  const it=e.target.closest(".sitem"); if(!it||!it.dataset.id)return;
  const [lng,lat]=it.dataset.c.split(",").map(Number);
  map.flyTo({center:[lng,lat],zoom:13.5});
  if(it.dataset.type==="karte")openKarte(it.dataset.id);
  resEl.style.display="none"; qEl.value="";
});
document.getElementById("searchBtn").onclick=()=>{
  const w=document.getElementById("searchwrap"); w.hidden=!w.hidden; if(!w.hidden)qEl.focus();
};
const LV0_BY_ID={}; LV0.forEach(r=>LV0_BY_ID[r.i]=r);
window.shareLink=(id)=>{
  const url=`${location.origin}${location.pathname}?id=${id}`;
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(()=>toast("共有リンクをコピー: "+url),()=>toast(url));
  else toast(url);
};
function openLv0Popup(rec){
  const [lng,lat]=rec.c;
  const srcTxt=/openstreetmap/.test(rec.s||"")?("OSM"+(rec.w?` (way ${rec.w}本)`:"")):"出典";
  const html=`<b>${rec.n}</b>
    ${rec.v?'<div class="prow"><span class="pk">状態</span><span class="pv" style="color:#ffd166">★Lv1候補（肉付け対象）</span></div>':""}
    <div class="prow"><span class="pk">Lv0 ID</span><span class="pv" style="font-family:var(--mono)">${rec.i}</span></div>
    ${rec.s?`<div class="prow"><span class="pk">取得元</span><a class="pv" style="color:#5db4ff" target="_blank" href="${rec.s}">${srcTxt}</a></div>`:""}
    <div class="prow"><span class="pk">地点</span><span class="pv" style="font-family:var(--mono)">${lat.toFixed(5)}, ${lng.toFixed(5)}</span></div>
    <div class="pbtns"><button class="pbtn nav" onclick="navTo(${lat},${lng})">🧭 ナビ</button>
    <button class="pbtn" onclick="copyCoord(${lat},${lng})">コピー</button>
    <button class="pbtn" onclick="shareLink('${rec.i}')">🔗 共有</button></div>`;
  new maplibregl.Popup({closeButton:true,maxWidth:"270px"}).setLngLat([lng,lat]).setHTML(html).addTo(map);
}
document.getElementById("sh-share").onclick=()=>{ if(curKarte)shareLink(curKarte.id); };
map.on("load",()=>{
  const id=new URLSearchParams(location.search).get("id");
  if(!id)return;
  if(KARTE_BY_ID[id]){const m=KARTE_BY_ID[id];map.flyTo({center:m.coord_approx,zoom:13.5});setTimeout(()=>openKarte(id),500);}
  else if(LV0_BY_ID[id]){const r=LV0_BY_ID[id];map.flyTo({center:r.c,zoom:13.5});setTimeout(()=>openLv0Popup(r),600);}
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
